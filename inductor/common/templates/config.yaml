# Inductor run config — copy to inductor/<N>/config.yaml and edit
name: octagon_2p_l1
cell: IND_OCT_2P
shape: octagon          # square | octagon | circle | figure8
ports: 2                # 2 | 3 | 4
role: inductor          # inductor | transformer | coupler | balun
n_layers: 1             # 1 | 2
width_um: 1.0
space_um: 1.0
turns: 3.5
inner_radius_um: 20.0
via_size_um: 0.6
via_enc_um: 0.2

# Optional pin map (defaults depend on ports)
# pin_map: [P1, P2]

em:
  f_start_hz: 1.0e8
  f_stop_hz: 2.0e10
  f_ref_hz: 2.4e9
  metal_thickness_um: 0.5
  via_height_um: 0.5
  conductivity: 5.8e7
  mesh_fraction_of_width: 0.25
